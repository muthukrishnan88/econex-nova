services:
  # Backend API Server
  - type: web
    name: econex-nova-api
    env: node
    region: oregon
    plan: free
    rootDir: econex-image-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: mock
