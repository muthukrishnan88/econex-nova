services:
  # Backend API Server
  - type: web
    name: econex-nova-api
    env: node
    region: oregon
    plan: free
    buildCommand: cd econex-image-server && npm install
    startCommand: cd econex-image-server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: AI_PROVIDER
        value: mock
      - key: CORS_ORIGIN
        generateValue: true

  # Frontend Static Site
  - type: static
    name: econex-nova-frontend
    env: static
    region: oregon
    buildCommand: echo "No build needed"
    staticPublishPath: ./ai-main
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: ECONEX_API_URL
        fromService:
          name: econex-nova-api
          type: web
          property: url
