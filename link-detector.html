<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECONEX NOVA — Scan Link</title>
    <link rel="icon" href="logo.jpeg">
    <style>
* {margin: 0;padding: 0;box-sizing: border-box;}

:root {
    --bg: #06130d;
    --card: rgba(16, 39, 27, 0.78);
    --green: #39e58c;
    --text: #f4fff8;
    --muted: #9cb8aa;
    --border: rgba(95, 255, 163, 0.16);
    --danger: #ff6b6b;
    --warning: #ffd166;
    --blue: #69a8ff;
}

body {
    min-height: 100vh;
    font-family: Inter, system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(145deg, #04100a 0%, #071a10 45%, #04110b 100%);
}

header {
    position: sticky;top: 0;z-index: 100;height: 76px;
    display: flex;align-items: center;justify-content: space-between;padding: 0 6%;
    background: rgba(4, 15, 10, 0.9);backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(110, 255, 169, 0.09);
}

.brand {display: flex;align-items: center;gap: 13px;}
.brand-logo {width: 45px;height: 45px;border-radius: 13px;}
.brand-name {font-size: 18px;font-weight: 900;}

nav {display: flex;gap: 25px;}
nav a {color: var(--muted);text-decoration: none;font-size: 14px;font-weight: 600;}
nav a:hover, nav a.active {color: var(--green);}

main {width: min(1180px, 92%);margin: auto;padding: 65px 0;}

.hero {text-align: center;max-width: 820px;margin: 0 auto 42px;}
.hero h1 {font-size: clamp(38px, 6vw, 72px);margin: 20px 0;}
.hero p {color: var(--muted);font-size: 16px;line-height: 1.75;}

.scan-card {
    background: var(--card);border-radius: 24px;padding: 45px;
    border: 1px solid var(--border);margin-bottom: 35px;
}

.input-wrap {display: flex;gap: 12px;margin-bottom: 15px;}
.url-input {
    flex: 1;height: 54px;padding: 0 20px;
    background: rgba(5, 20, 12, 0.6);border: 1px solid var(--border);
    border-radius: 14px;color: var(--text);font-size: 15px;outline: none;
}
.url-input:focus {border-color: var(--green);background: rgba(5, 20, 12, 0.8);}

.scan-btn {
    height: 54px;padding: 0 32px;border: none;border-radius: 14px;
    background: var(--green);color: #041108;font-weight: 800;
    font-size: 14px;cursor: pointer;
}

.examples {display: flex;gap: 8px;flex-wrap: wrap;}
.example {
    padding: 8px 14px;border: 1px solid var(--border);
    border-radius: 10px;font-size: 12px;color: var(--muted);
    cursor: pointer;background: rgba(57, 229, 140, 0.05);
}
.example:hover {background: rgba(57, 229, 140, 0.1);color: var(--green);}

.results {display: none;margin-top: 35px;}
.results.active {display: block;}

.result-card {
    background: var(--card);border: 1px solid var(--border);
    border-radius: 20px;padding: 35px;margin-bottom: 25px;
}

.result-card h3 {color: var(--green);font-size: 24px;margin-bottom: 15px;}
.result-card h4 {color: var(--green);font-size: 16px;margin: 15px 0 10px;}
.result-card p {color: var(--text);margin: 8px 0;line-height: 1.6;}

.score-ring {
    width: 180px;height: 180px;margin: 20px auto;
    border-radius: 50%;position: relative;
    display: flex;align-items: center;justify-content: center;
}
.score-ring::after {
    content: "";position: absolute;inset: 12px;
    border-radius: 50%;background: #0b2115;
}
.score-value {position: relative;z-index: 2;text-align: center;}
.score-number {font-size: 52px;font-weight: 900;display: block;}
.score-label {font-size: 14px;color: var(--muted);}

.verdict-badge {
    display: inline-block;padding: 10px 20px;
    border-radius: 999px;font-size: 14px;font-weight: 800;margin: 15px 0;
}
.verdict-safe {background: rgba(57, 229, 140, 0.15);color: var(--green);}
.verdict-caution {background: rgba(255, 209, 102, 0.15);color: var(--warning);}
.verdict-risky {background: rgba(255, 107, 107, 0.15);color: var(--danger);}

.indicator-list {list-style: none;padding: 0;margin: 15px 0;}
.indicator-list li {
    padding: 10px;margin: 8px 0;border-radius: 10px;
    background: rgba(255, 255, 255, 0.03);color: var(--text);
}
.indicator-list li.positive {background: rgba(57, 229, 140, 0.08);border-left: 3px solid var(--green);}
.indicator-list li.negative {background: rgba(255, 107, 107, 0.08);border-left: 3px solid var(--danger);}

.url-detail {
    background: rgba(57, 229, 140, 0.05);padding: 15px;
    border-radius: 12px;margin: 10px 0;word-break: break-all;
}

.loading {text-align: center;padding: 40px;font-size: 18px;}
.error {text-align: center;padding: 40px;color: var(--danger);}
    </style>
</head>
<body>

<header>
    <div class="brand">
        <img src="logo.jpeg" class="brand-logo">
        <div class="brand-name">ECONEX NOVA</div>
    </div>
    <nav>
        <a href="index.html">Scan Waste</a>
        <a href="image.html">Scan Pollution</a>
        <a href="disaster.html">Scan Disaster</a>
        <a href="link-detector.html" class="active">Scan Link</a>
    </nav>
</header>

<main>
    <div class="hero">
        <h1>Scan <span style="color:var(--green)">Link</span></h1>
        <p>Intelligent URL security analysis. Enter any link to check safety, detect phishing attempts, and understand website details.</p>
    </div>

    <div class="scan-card">
        <div class="input-wrap">
            <input type="text" id="urlInput" class="url-input" placeholder="https://example.com">
            <button class="scan-btn" onclick="analyzeLink()">ANALYZE</button>
        </div>
        <div class="examples">
            <span class="example" onclick="setExample('https://github.com')">github.com</span>
            <span class="example" onclick="setExample('https://google.com')">google.com</span>
            <span class="example" onclick="setExample('https://youtube.com')">youtube.com</span>
        </div>
    </div>

    <div class="results" id="results"></div>
</main>

<script>
const API_BASE_URL = 'http://localhost:3000/api';

function setExample(url) {
    document.getElementById('urlInput').value = url;
}

async function analyzeLink() {
    const url = document.getElementById('urlInput').value.trim();
    const resultsDiv = document.getElementById('results');

    if (!url) {
        alert('Please enter a URL');
        return;
    }

    resultsDiv.innerHTML = '<div class="loading">🔍 Analyzing link...</div>';
    resultsDiv.classList.add('active');

    try {
        const response = await fetch(`${API_BASE_URL}/link/analyze`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url })
        });

        const data = await response.json();

        if (data.success) {
            renderResults(data);
        } else {
            resultsDiv.innerHTML = `<div class="error">❌ ${data.error?.message || 'Analysis failed'}</div>`;
        }
    } catch (error) {
        console.error('Error:', error);
        resultsDiv.innerHTML = '<div class="error">❌ Network error. Check server.</div>';
    }
}

function renderResults(data) {
    const score = data.securityScore;
    const degrees = (score / 100) * 360;
    const verdict = data.verdict;
    const riskLevel = data.riskLevel;

    let verdictClass = 'verdict-safe';
    let scoreColor = '#39e58c';
    if (verdict === 'Caution') {
        verdictClass = 'verdict-caution';
        scoreColor = '#ffd166';
    } else if (verdict === 'Risky') {
        verdictClass = 'verdict-risky';
        scoreColor = '#ff6b6b';
    }

    let html = `
        <div class="result-card">
            <h3>🔐 Security Analysis</h3>
            <div class="score-ring" style="background: conic-gradient(${scoreColor} 0deg, ${scoreColor} ${degrees}deg, rgba(255,255,255,0.08) ${degrees}deg);">
                <div class="score-value">
                    <span class="score-number" style="color:${scoreColor};">${score}</span>
                    <span class="score-label">/ 100</span>
                </div>
            </div>
            <div style="text-align:center;">
                <div class="verdict-badge ${verdictClass}">${verdict.toUpperCase()}</div>
                <p><strong>Risk Level:</strong> ${riskLevel}</p>
                <p><strong>Confidence:</strong> ${data.confidence}</p>
            </div>
        </div>

        <div class="result-card">
            <h3>🌐 Website Information</h3>
            <p><strong>Name:</strong> ${data.website.name}</p>
            <p><strong>Type:</strong> ${data.website.type}</p>
            <p><strong>Category:</strong> ${data.website.category}</p>
            <p><strong>Purpose:</strong> ${data.website.purpose}</p>
        </div>

        <div class="result-card">
            <h3>🔍 URL Details</h3>
            <div class="url-detail">
                <p><strong>Full URL:</strong> ${data.url.raw}</p>
            </div>
            <p><strong>Protocol:</strong> ${data.url.protocol}</p>
            <p><strong>Domain:</strong> ${data.url.domain}</p>
            <p><strong>Root Domain:</strong> ${data.url.rootDomain}</p>
            ${data.url.subdomain ? `<p><strong>Subdomain:</strong> ${data.url.subdomain}</p>` : ''}
            <p><strong>Path:</strong> ${data.url.path}</p>
            ${data.url.query ? `<p><strong>Query:</strong> ${data.url.query}</p>` : ''}
        </div>

        ${data.security.indicators.positive.length > 0 || data.security.indicators.negative.length > 0 ? `
            <div class="result-card">
                <h3>⚡ Security Indicators</h3>
                ${data.security.indicators.positive.length > 0 ? `
                    <h4>✅ Positive Signals</h4>
                    <ul class="indicator-list">
                        ${data.security.indicators.positive.map(i => `<li class="positive">✓ ${i}</li>`).join('')}
                    </ul>
                ` : ''}
                ${data.security.indicators.negative.length > 0 ? `
                    <h4>⚠️ Warning Signs</h4>
                    <ul class="indicator-list">
                        ${data.security.indicators.negative.map(i => `<li class="negative">✗ ${i}</li>`).join('')}
                    </ul>
                ` : ''}
                ${data.security.indicators.neutral.length > 0 ? `
                    <h4>ℹ️ Observations</h4>
                    <ul class="indicator-list">
                        ${data.security.indicators.neutral.map(i => `<li>• ${i}</li>`).join('')}
                    </ul>
                ` : ''}
            </div>
        ` : ''}

        <div class="result-card">
            <h3>💡 Why This Score?</h3>
            <p>${data.questions.whyScore}</p>
            ${data.security.knownPhishing ? `
                <p style="margin-top:15px;padding:15px;background:rgba(255,107,107,0.1);border-radius:10px;color:#ff8787;">
                    <strong>⚠️ Phishing Warning:</strong> This URL contains patterns commonly used in phishing attacks. Exercise extreme caution.
                </p>
            ` : ''}
        </div>
    `;

    document.getElementById('results').innerHTML = html;
}

document.getElementById('urlInput').addEventListener('keypress', (e) => {
    if (e.key === 'Enter') analyzeLink();
});
</script>

</body>
</html>
