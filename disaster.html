<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECONEX NOVA — Scan Disaster</title>
    <link rel="icon" href="logo.jpeg">
    <style>
* {margin: 0;padding: 0;box-sizing: border-box;}

:root {
    --bg: #06130d;
    --card: rgba(16, 39, 27, 0.78);
    --green: #39e58c;
    --text: #f4fff8;
    --muted: #9cb8aa;
    --border: rgba(95, 255, 163, 0.16);
    --danger: #ff6b6b;
}

body {
    min-height: 100vh;
    font-family: Inter, system-ui, sans-serif;
    color: var(--text);
    background: linear-gradient(145deg, #04100a 0%, #071a10 45%, #04110b 100%);
}

header {
    position: sticky;top: 0;z-index: 100;height: 76px;
    display: flex;align-items: center;justify-content: space-between;padding: 0 6%;
    background: rgba(4, 15, 10, 0.9);backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(110, 255, 169, 0.09);
}

.brand {display: flex;align-items: center;gap: 13px;}
.brand-logo {width: 45px;height: 45px;border-radius: 13px;}
.brand-name {font-size: 18px;font-weight: 900;}

nav {display: flex;gap: 25px;}
nav a {color: var(--muted);text-decoration: none;font-size: 14px;font-weight: 600;}
nav a:hover, nav a.active {color: var(--green);}

main {width: min(1180px, 92%);margin: auto;padding: 65px 0;}

.hero {text-align: center;max-width: 820px;margin: 0 auto 42px;}
.hero h1 {font-size: clamp(38px, 6vw, 72px);margin: 20px 0;}
.hero p {color: var(--muted);font-size: 16px;line-height: 1.75;}

.upload-card {
    background: var(--card);border-radius: 24px;padding: 45px;
    border: 1px solid var(--border);margin-bottom: 35px;
}

.upload-area {
    border: 2px dashed var(--border);border-radius: 18px;
    padding: 60px 30px;text-align: center;cursor: pointer;
}

.upload-btn {
    background: var(--green);color: #041108;
    border: none;padding: 14px 32px;border-radius: 12px;
    font-weight: 700;font-size: 15px;cursor: pointer;
}

#imageInput {display: none;}

.results {display: none;margin-top: 35px;}
.results.active {display: block;}

.disaster-card {
    background: var(--card);border: 1px solid var(--border);
    border-radius: 20px;padding: 35px;margin-bottom: 25px;
}

.disaster-card h3 {color: var(--green);font-size: 24px;margin-bottom: 15px;}
.disaster-card h4 {color: var(--green);font-size: 16px;margin: 15px 0 10px;}
.disaster-card p {color: var(--text);margin: 8px 0;}
.disaster-card ul {list-style: none;padding-left: 20px;}
.disaster-card li {color: var(--text);padding: 6px 0;position: relative;}
.disaster-card li:before {content: "✓";position: absolute;left: -20px;color: var(--green);}

.concern-score {font-size: 42px;font-weight: 900;color: var(--danger);}
.location-card {background: rgba(57, 229, 140, 0.08);padding: 20px;border-radius: 12px;}
.safety-card {background: rgba(255, 107, 107, 0.08);border: 1px solid rgba(255, 107, 107, 0.2);padding: 20px;border-radius: 12px;}
.loading {text-align: center;padding: 40px;font-size: 18px;}
.error {text-align: center;padding: 40px;color: var(--danger);}
    </style>
</head>
<body>

<header>
    <div class="brand">
        <img src="logo.jpeg" class="brand-logo">
        <div class="brand-name">ECONEX NOVA</div>
    </div>
    <nav>
        <a href="index.html">Scan Waste</a>
        <a href="image.html">Scan Pollution</a>
        <a href="disaster.html" class="active">Scan Disaster</a>
    </nav>
</header>

<main>
    <div class="hero">
        <h1>Scan <span style="color:var(--green)">Disaster</span></h1>
        <p>Evidence-based disaster detection powered by AI. Upload an image to identify disaster types, find affected areas, and get safety guidance.</p>
    </div>

    <div class="upload-card">
        <div class="upload-area" onclick="document.getElementById('imageInput').click()">
            <div style="font-size:52px;margin-bottom:18px;">🌍</div>
            <h3>Upload Disaster Image</h3>
            <p style="color:var(--muted);margin:10px 0 22px;">Drag and drop or click to upload</p>
            <button class="upload-btn">Choose Image</button>
        </div>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div class="results" id="results"></div>
</main>

<script>
const API_BASE_URL = 'http://localhost:3000/api';

document.getElementById('imageInput').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (file) analyzeDisaster(file);
});

async function analyzeDisaster(file) {
    const resultsDiv = document.getElementById('results');
    resultsDiv.innerHTML = '<div class="loading">🌍 Analyzing disaster...</div>';
    resultsDiv.classList.add('active');

    const formData = new FormData();
    formData.append('image', file);

    try {
        const response = await fetch(`${API_BASE_URL}/disaster/analyze`, {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (data.success) {
            renderResults(data);
        } else {
            resultsDiv.innerHTML = '<div class="error">❌ Analysis failed</div>';
        }
    } catch (error) {
        console.error('Error:', error);
        resultsDiv.innerHTML = '<div class="error">❌ Network error. Check server.</div>';
    }
}

function renderResults(data) {
    const disaster = data.disaster;
    const affected = data.affectedArea;
    const concern = data.concernScore;
    const safety = data.safetyGuidance;
    const impacts = data.impacts;

    // Check if this is a historical disaster
    const isHistorical = disaster.isHistorical === true;

    let html = `
        <div class="disaster-card">
            <h3>🌪️ ${isHistorical ? 'Historical Disaster Detected' : 'Disaster Detected'}</h3>
            <div style="text-align:center;margin:25px 0;">
                <div class="concern-score">${concern.score}</div>
                <p style="color:var(--muted);">Concern Score / 100</p>
                <p style="margin-top:10px;"><strong>Level:</strong> ${concern.level.toUpperCase()}</p>
            </div>
            ${isHistorical ? `
                <h4 style="font-size:28px;text-align:center;margin:20px 0;color:var(--green);">${disaster.name}</h4>
                <div style="text-align:center;margin:20px 0;">
                    <p style="font-size:18px;color:var(--text);"><strong>Location:</strong> ${disaster.location}</p>
                    <p style="font-size:16px;color:var(--muted);margin:8px 0;"><strong>Date:</strong> ${disaster.date}</p>
                    <p style="font-size:16px;color:var(--text);margin:8px 0;"><strong>Type:</strong> ${formatType(disaster.type)} ${disaster.subtype ? `(${disaster.subtype.replace(/_/g, ' ')})` : ''}</p>
                    ${disaster.casualties ? `<p style="font-size:15px;color:#ff6b6b;margin:8px 0;"><strong>Casualties:</strong> ${disaster.casualties}</p>` : ''}
                    ${disaster.damage ? `<p style="font-size:15px;color:#ffd166;margin:8px 0;"><strong>Damage:</strong> ${disaster.damage}</p>` : ''}
                    ${disaster.impactDetails ? `<p style="font-size:14px;color:var(--muted);margin:12px 0;">${disaster.impactDetails}</p>` : ''}
                </div>
            ` : `
                <h4 style="font-size:28px;text-align:center;margin:20px 0;">${formatType(disaster.type)}</h4>
                <p style="text-align:center;color:var(--muted);">${disaster.subtype.replace(/_/g, ' ')}</p>
            `}
            <p style="text-align:center;margin-top:15px;"><strong>Confidence:</strong> ${disaster.confidence}%</p>
        </div>

        <div class="disaster-card">
            <h4>👁️ ${isHistorical ? 'Historical Evidence' : 'Visual Evidence'}</h4>
            <ul>
                ${disaster.evidence.map(e => `<li>${e}</li>`).join('')}
            </ul>
        </div>

        ${affected.latitude ? `
            <div class="disaster-card">
                <h4>📍 Affected Area</h4>
                <div class="location-card">
                    <p><strong>${affected.location}</strong></p>
                    <p>${affected.country}</p>
                    <p style="margin-top:10px;"><strong>Coordinates:</strong> ${affected.latitude}, ${affected.longitude}</p>
                    <p><strong>Event:</strong> ${affected.eventTitle || 'Disaster event'}</p>
                    <p><strong>Status:</strong> ${affected.status}</p>
                    <p><strong>Severity:</strong> ${affected.severity}</p>
                    <p style="margin-top:10px;font-size:13px;color:var(--muted);">
                        <strong>Source:</strong> ${affected.dataSource} |
                        <strong>Updated:</strong> ${new Date(affected.lastUpdated).toLocaleString()}
                    </p>
                </div>
            </div>
        ` : `
            <div class="disaster-card">
                <h4>📍 Affected Area</h4>
                <div class="location-card">
                    <p>⚠️ Location could not be confirmed from available open data.</p>
                    <p style="font-size:13px;color:var(--muted);margin-top:10px;">No matching event in GDACS data.</p>
                </div>
            </div>
        `}

        <div class="disaster-card">
            <h4>💥 Impact Assessment</h4>
            <div style="margin:15px 0;">
                <p><strong>👥 Human Impact:</strong></p>
                <ul>
                    ${impacts.human.slice(0,3).map(i => `<li>${i}</li>`).join('')}
                </ul>
            </div>
            <div style="margin:15px 0;">
                <p><strong>🌳 Environmental Impact:</strong></p>
                <ul>
                    ${impacts.environmental.slice(0,3).map(i => `<li>${i}</li>`).join('')}
                </ul>
            </div>
            <div style="margin:15px 0;">
                <p><strong>🏗️ Infrastructure Impact:</strong></p>
                <ul>
                    ${impacts.infrastructure.slice(0,3).map(i => `<li>${i}</li>`).join('')}
                </ul>
            </div>
        </div>

        <div class="disaster-card">
            <div class="safety-card">
                <h4>⚠️ WHAT TO DO IMMEDIATELY</h4>
                <ul>
                    ${safety.immediate.map(s => `<li>${s}</li>`).join('')}
                </ul>
                <h4 style="margin-top:20px;">🚫 WHAT TO AVOID</h4>
                <ul>
                    ${safety.avoid.map(s => `<li>${s}</li>`).join('')}
                </ul>
                <p style="margin-top:20px;padding:15px;background:rgba(255,107,107,0.1);border-radius:8px;font-size:13px;">
                    <strong>⚠️ Important:</strong> For active emergencies, follow official emergency alerts and local authorities.
                </p>
            </div>
        </div>
    `;

    document.getElementById('results').innerHTML = html;
}

function formatType(type) {
    return type.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
</script>

</body>
</html>
