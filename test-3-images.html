<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3-Image Accuracy Test | ECONEX NOVA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .upload-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .upload-card {
            background: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .upload-card.has-image {
            border-color: #28a745;
            background: #e8f5e9;
        }

        .upload-card h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .upload-card input[type="file"] {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .image-preview {
            margin-top: 15px;
            border-radius: 8px;
            overflow: hidden;
            display: none;
        }

        .image-preview.visible {
            display: block;
        }

        .image-preview img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .image-hash {
            font-family: monospace;
            font-size: 11px;
            color: #6c757d;
            margin-top: 10px;
            word-break: break-all;
            background: white;
            padding: 8px;
            border-radius: 4px;
        }

        .controls {
            text-align: center;
            margin-bottom: 40px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        button:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .results-container {
            display: none;
        }

        .results-container.visible {
            display: block;
        }

        .image-test-results {
            margin-bottom: 40px;
            background: #f8f9fa;
            border-radius: 12px;
            padding: 25px;
            border-left: 5px solid #667eea;
        }

        .image-test-results.stable {
            border-left-color: #28a745;
        }

        .image-test-results.unstable {
            border-left-color: #dc3545;
        }

        .image-test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .image-test-header h2 {
            color: #2c3e50;
            font-size: 24px;
        }

        .stability-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
        }

        .stability-badge.stable {
            background: #d4edda;
            color: #155724;
        }

        .stability-badge.unstable {
            background: #f8d7da;
            color: #721c24;
        }

        .runs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .run-card {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #dee2e6;
        }

        .run-card h4 {
            color: #495057;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .run-primary {
            font-weight: bold;
            color: #e74c3c;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .run-confidence {
            color: #27ae60;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .run-cached {
            display: inline-block;
            background: #f39c12;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        .analysis-details {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-top: 15px;
        }

        .detail-section {
            margin-bottom: 15px;
        }

        .detail-section h4 {
            color: #2c3e50;
            margin-bottom: 8px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .detail-list {
            list-style: none;
            padding-left: 0;
        }

        .detail-list li {
            padding: 5px 0;
            color: #495057;
            font-size: 14px;
        }

        .detail-list li::before {
            content: "✓ ";
            color: #28a745;
            font-weight: bold;
            margin-right: 8px;
        }

        .rejected-list li::before {
            content: "✗ ";
            color: #dc3545;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .stat-card {
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 3-Image Accuracy Test</h1>
        <p class="subtitle">Upload 3 reference images to test pollution detection stability and accuracy</p>

        <div class="upload-section">
            <div class="upload-card" id="card1">
                <h3>📸 Image 1</h3>
                <input type="file" id="image1" accept="image/*">
                <div class="image-preview" id="preview1">
                    <img id="img1" alt="Preview 1">
                </div>
                <div class="image-hash" id="hash1"></div>
            </div>

            <div class="upload-card" id="card2">
                <h3>📸 Image 2</h3>
                <input type="file" id="image2" accept="image/*">
                <div class="image-preview" id="preview2">
                    <img id="img2" alt="Preview 2">
                </div>
                <div class="image-hash" id="hash2"></div>
            </div>

            <div class="upload-card" id="card3">
                <h3>📸 Image 3</h3>
                <input type="file" id="image3" accept="image/*">
                <div class="image-preview" id="preview3">
                    <img id="img3" alt="Preview 3">
                </div>
                <div class="image-hash" id="hash3"></div>
            </div>
        </div>

        <div class="controls">
            <button id="runTestBtn" disabled>Run 5-Run Stability Test (All 3 Images)</button>
            <button id="clearBtn">Clear All</button>
        </div>

        <div id="loadingDiv" class="loading" style="display: none;">
            <div class="loading-spinner"></div>
            <p>Testing images... This may take a minute.</p>
        </div>

        <div id="resultsContainer" class="results-container"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://localhost:3000/api';
        const images = {
            1: null,
            2: null,
            3: null
        };

        // SHA-256 hash function
        async function calculateHash(file) {
            const buffer = await file.arrayBuffer();
            const hashBuffer = await crypto.subtle.digest('SHA-256', buffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Setup file inputs
        [1, 2, 3].forEach(num => {
            const input = document.getElementById(`image${num}`);
            const preview = document.getElementById(`preview${num}`);
            const img = document.getElementById(`img${num}`);
            const hashDiv = document.getElementById(`hash${num}`);
            const card = document.getElementById(`card${num}`);

            input.addEventListener('change', async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                images[num] = file;

                // Show preview
                const reader = new FileReader();
                reader.onload = (e) => {
                    img.src = e.target.result;
                    preview.classList.add('visible');
                };
                reader.readAsDataURL(file);

                // Calculate and show hash
                const hash = await calculateHash(file);
                hashDiv.textContent = `Hash: ${hash.substring(0, 16)}...`;

                card.classList.add('has-image');

                checkReady();
            });
        });

        function checkReady() {
            const allLoaded = images[1] && images[2] && images[3];
            document.getElementById('runTestBtn').disabled = !allLoaded;
        }

        document.getElementById('clearBtn').addEventListener('click', () => {
            [1, 2, 3].forEach(num => {
                document.getElementById(`image${num}`).value = '';
                document.getElementById(`preview${num}`).classList.remove('visible');
                document.getElementById(`hash${num}`).textContent = '';
                document.getElementById(`card${num}`).classList.remove('has-image');
                images[num] = null;
            });
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('resultsContainer').classList.remove('visible');
            checkReady();
        });

        document.getElementById('runTestBtn').addEventListener('click', async () => {
            document.getElementById('runTestBtn').disabled = true;
            document.getElementById('loadingDiv').style.display = 'block';
            document.getElementById('resultsContainer').innerHTML = '';
            document.getElementById('resultsContainer').classList.remove('visible');

            const allResults = [];

            for (let imageNum = 1; imageNum <= 3; imageNum++) {
                const file = images[imageNum];
                const hash = await calculateHash(file);
                const runs = [];

                // Run same image 5 times
                for (let runNum = 1; runNum <= 5; runNum++) {
                    const formData = new FormData();
                    formData.append('image', file);

                    try {
                        const response = await fetch(`${API_BASE_URL}/pollution/analyze`, {
                            method: 'POST',
                            body: formData
                        });

                        const data = await response.json();
                        runs.push({
                            run: runNum,
                            data: data
                        });
                    } catch (error) {
                        runs.push({
                            run: runNum,
                            error: error.message
                        });
                    }

                    // Small delay
                    await new Promise(resolve => setTimeout(resolve, 500));
                }

                allResults.push({
                    imageNum,
                    hash,
                    runs
                });
            }

            displayResults(allResults);
            document.getElementById('loadingDiv').style.display = 'none';
            document.getElementById('resultsContainer').classList.add('visible');
            document.getElementById('runTestBtn').disabled = false;
        });

        function displayResults(allResults) {
            const container = document.getElementById('resultsContainer');

            allResults.forEach(imageResult => {
                const { imageNum, hash, runs } = imageResult;

                // Extract primary types and confidences
                const primaryTypes = runs.map(r => {
                    if (r.error) return 'ERROR';
                    const data = r.data;
                    if (data.pollutionDetected === false) return 'NO_POLLUTION';
                    if (data.pollution) return data.pollution.primaryType;
                    if (data.primaryPollution) return data.primaryPollution.type;
                    return 'UNKNOWN';
                });

                const confidences = runs.map(r => {
                    if (r.error) return 0;
                    const data = r.data;
                    if (data.pollutionDetected === false) return 100;
                    if (data.pollution) return data.pollution.confidence;
                    if (data.primaryPollution) return data.primaryPollution.confidence;
                    return 0;
                });

                // Check stability
                const uniqueTypes = [...new Set(primaryTypes)];
                const isStable = uniqueTypes.length === 1 && uniqueTypes[0] !== 'ERROR';

                const firstRun = runs[0].data;

                const html = `
                    <div class="image-test-results ${isStable ? 'stable' : 'unstable'}">
                        <div class="image-test-header">
                            <h2>Image ${imageNum} Results</h2>
                            <span class="stability-badge ${isStable ? 'stable' : 'unstable'}">
                                ${isStable ? '✅ STABLE' : '❌ UNSTABLE'}
                            </span>
                        </div>

                        <div class="image-hash">Hash: ${hash}</div>

                        <div class="runs-grid">
                            ${runs.map((run, idx) => {
                                if (run.error) {
                                    return `
                                        <div class="run-card">
                                            <h4>Run ${run.run}</h4>
                                            <div class="error">ERROR: ${run.error}</div>
                                        </div>
                                    `;
                                }

                                const data = run.data;
                                let primary = 'UNKNOWN';
                                let confidence = 0;
                                let cached = data.cached || false;

                                if (data.pollutionDetected === false) {
                                    primary = 'NO POLLUTION';
                                    confidence = 100;
                                } else if (data.pollution) {
                                    primary = formatType(data.pollution.primaryType);
                                    confidence = data.pollution.confidence;
                                } else if (data.primaryPollution) {
                                    primary = formatType(data.primaryPollution.type);
                                    confidence = data.primaryPollution.confidence;
                                }

                                return `
                                    <div class="run-card">
                                        <h4>Run ${run.run} ${cached ? '<span class="run-cached">CACHED</span>' : ''}</h4>
                                        <div class="run-primary">${primary}</div>
                                        <div class="run-confidence">Confidence: ${confidence}%</div>
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        ${!runs[0].error && firstRun ? `
                            <div class="analysis-details">
                                ${firstRun.pollution && firstRun.pollution.visualEvidence ? `
                                    <div class="detail-section">
                                        <h4>Visual Evidence</h4>
                                        <ul class="detail-list">
                                            ${firstRun.pollution.visualEvidence.slice(0, 5).map(e => `<li>${e}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}

                                ${firstRun.rejectedCategories && firstRun.rejectedCategories.length > 0 ? `
                                    <div class="detail-section">
                                        <h4>Rejected Categories</h4>
                                        <ul class="detail-list rejected-list">
                                            ${firstRun.rejectedCategories.slice(0, 5).map(r => `<li>${formatType(r.type)}: ${r.reason}</li>`).join('')}
                                        </ul>
                                    </div>
                                ` : ''}
                            </div>
                        ` : ''}

                        <div class="summary-stats">
                            <div class="stat-card">
                                <div class="stat-value">${uniqueTypes.length}</div>
                                <div class="stat-label">Unique Types</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${Math.min(...confidences)}% - ${Math.max(...confidences)}%</div>
                                <div class="stat-label">Confidence Range</div>
                            </div>
                            <div class="stat-card">
                                <div class="stat-value">${runs.filter(r => r.data && r.data.cached).length}/5</div>
                                <div class="stat-label">Cache Hits</div>
                            </div>
                        </div>
                    </div>
                `;

                container.innerHTML += html;
            });
        }

        function formatType(type) {
            if (!type) return 'Unknown';
            return type.split('_').map(word => word.charAt(0).toUpperCase() + word.slice(1)).join(' ');
        }
    </script>
</body>
</html>
